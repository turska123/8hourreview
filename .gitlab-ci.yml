# GitLab Pages copy of the site. The live site (www.8hourreview.com) is NOT this: Netlify builds it from the GitHub
# mirror of main. Nobody uses this copy yet, so it runs ONLY when asked (400 free CI minutes a month):
#   - a pushed `publish-*` tag, or
#   - a manual run: Build > Pipelines > Run pipeline.
# Ordinary pushes to any branch start no pipeline. No check job yet: it needs the self-hosted runner
# (dev-wiki/standards §9); until then the pre-push hook (tools/check.sh) is the gate.

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^publish-/
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

# GitLab Pages serves the "public" artifact of the job named "pages". Nuxt already copies the repo's public/
# folder (favicon, robots.txt) into .output/public, so replacing it here is safe.
pages:
  stage: deploy
  image: node:24-slim
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npx nuxt generate
    - rm -rf public && cp -r .output/public public
  artifacts:
    paths: [public]
